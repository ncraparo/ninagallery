<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nina — Peintures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--wall:#dfddd2;--ink:#1d282c;--muted:#5d6a6c;--blue:#2c4a8c;--line:#c3c1b4;--field:#ecebe3}
@media(prefers-color-scheme:dark){:root{--wall:#13191c;--ink:#e8e6dc;--muted:#97a3a4;--blue:#8fa9e6;--line:#2c373b;--field:#1b2327}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--wall);color:var(--ink);font:300 1rem/1.6 Jost,system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(1rem,4vw,3rem)}
header{padding:clamp(2.5rem,8vw,6rem) 0 2rem}
h1{font:italic 400 clamp(5rem,20vw,11rem)/.82 "Instrument Serif",Georgia,serif;margin:0;letter-spacing:-.02em}
.sub{font:400 clamp(1.3rem,3vw,1.8rem)/1.3 "Instrument Serif",Georgia,serif;margin:1.2rem 0 .3rem}
.ded{color:var(--muted);margin:0;max-width:46ch}
.bar{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.9rem 0;margin-bottom:2rem}
#q{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:2px;padding:.5rem .8rem;min-width:min(100%,16rem)}
#chips{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem}
#chips button{font:inherit;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:.2rem 0;cursor:pointer}
#chips button.on{color:var(--ink);border-color:var(--blue)}
#count{margin-left:auto;color:var(--muted)}
#note{border-left:3px solid var(--blue);padding:.2rem 1rem;margin:0 0 2rem;color:var(--muted)}
#grid{columns:250px;column-gap:clamp(1.2rem,3vw,2.4rem)}
.card{break-inside:avoid;margin:0 0 clamp(1.6rem,3vw,2.6rem);cursor:pointer}
.fr{background:linear-gradient(135deg,#d2b86e,#8a7034 55%,#c4a65a);padding:6px;box-shadow:0 14px 24px -12px rgba(0,0,0,.55);transition:transform .2s}
.card:hover .fr,.card:focus-visible .fr{transform:translateY(-3px)}
.fr>*{display:block;width:100%;height:auto;outline:1px solid rgba(0,0,0,.4);background:var(--field)}
.card:focus-visible{outline:2px solid var(--blue);outline-offset:6px}
figcaption{margin-top:.75rem;font:italic 400 1.15rem/1.25 "Instrument Serif",Georgia,serif}
figcaption small{display:block;font:300 .85rem Jost,sans-serif;color:var(--muted)}
.empty{color:var(--muted);padding:3rem 0}
footer{border-top:1px solid var(--line);color:var(--muted);padding:2rem 0 3rem;margin-top:2rem}
#lb{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:3.5rem 1rem 1.5rem;background:rgba(10,13,15,.95);color:#e8e6dc}
#lb.open{display:flex}
#lbimg{padding:8px;background:linear-gradient(135deg,#d2b86e,#8a7034 55%,#c4a65a);max-width:92vw}
#lbimg img{display:block;max-width:100%;max-height:68vh;margin:auto;outline:1px solid rgba(0,0,0,.45)}
#lbimg .ph{width:min(70vw,460px)}
#lbcap{text-align:center;max-width:60ch}
#lbcap h2{font:italic 400 1.8rem/1.2 "Instrument Serif",Georgia,serif;margin:0}
#lbcap p{margin:.2rem 0;color:#aab3b3}
.nav{position:absolute;background:none;border:0;color:#e8e6dc;font:300 2.6rem/1 Jost,sans-serif;cursor:pointer;padding:.6rem 1rem}
.nav:focus-visible{outline:2px solid #8fa9e6}
#prev{left:0;top:45%}#next{right:0;top:45%}#x{right:0;top:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name">Nina</h1>
    <p class="sub" id="subtitle"></p>
    <p class="ded" id="ded"></p>
  </header>
  <p id="note" hidden>Ceci est un aperçu. Ajoutez vos photos au dossier <b>paintings</b> puis lancez <b>build_gallery.py</b> pour remplacer ces exemples.</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Rechercher une peinture" aria-label="Rechercher une peinture">
    <div id="chips" role="group" aria-label="Filtrer par décennie"></div>
    <span id="count" aria-live="polite"></span>
  </div>
  <main id="grid"></main>
  <footer id="foot"></footer>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Peinture">
  <button class="nav" id="x" aria-label="Fermer">&times;</button>
  <button class="nav" id="prev" aria-label="Précédente">&lsaquo;</button>
  <button class="nav" id="next" aria-label="Suivante">&rsaquo;</button>
  <div id="lbimg"></div>
  <div id="lbcap"></div>
</div>

<script src="paintings.js"></script>
<script>
// ---- Edit these lines to personalise the gallery ----
const SITE={
  name:"Nina",
  subtitle:"Peintures à l'huile, oil paintings",
  dedication:"Pour Mamie Nina, avec tout notre amour. Ses toiles, réunies au même endroit.",
  footer:"Galerie de la famille de Nina"
};
// -----------------------------------------------------
const SAMPLE=[
 {title:"Les tournesols",year:1978,w:4,h:5,g:"linear-gradient(160deg,#e9c46a,#c98b2b 60%,#4a5a2a)"},
 {title:"Port de Honfleur",year:1984,w:5,h:4,g:"linear-gradient(180deg,#a9c3d6,#5a7fa3 55%,#2b4466)"},
 {title:"Lavande, Provence",year:1991,w:3,h:4,g:"linear-gradient(170deg,#e3d7ec,#8d78b8 55%,#4b3d78)"},
 {title:"Nature morte aux poires",year:1976,w:1,h:1,g:"linear-gradient(145deg,#d9c78a,#7a8a3a 60%,#3a3f22)"},
 {title:"Le marché d'Aix",year:1999,w:5,h:3,g:"linear-gradient(175deg,#f0b69a,#c9604a 55%,#6b2a2a)"},
 {title:"Rue sous la pluie",year:2005,w:4,h:5,g:"linear-gradient(165deg,#9fb0b8,#56707e 55%,#25363f)"}
].map(p=>({...p,sample:1}));
const real=Array.isArray(window.PAINTINGS)&&window.PAINTINGS.length;
const all=real?window.PAINTINGS:SAMPLE;
let view=all,cur=0,decade="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ratio=p=>`aspect-ratio:${p.w||4}/${p.h||5}`;

document.title=SITE.name+" — Peintures";
$("#name").textContent=SITE.name;
$("#subtitle").textContent=SITE.subtitle;
$("#ded").textContent=SITE.dedication;
$("#foot").textContent=SITE.footer;
$("#note").hidden=!!real;

const decs=[...new Set(all.filter(p=>p.year).map(p=>Math.floor(p.year/10)*10))].sort();
$("#chips").innerHTML=decs.length>1?['',...decs].map(d=>`<button data-d="${d}" class="${d===''?'on':''}">${d?d+"s":"Toutes"}</button>`).join(""):"";
$("#chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;decade=b.dataset.d;
  document.querySelectorAll("#chips button").forEach(x=>x.classList.toggle("on",x===b));render()};
$("#q").oninput=render;

function art(p,full){
  if(p.sample)return `<div class="ph" style="background:${p.g};${ratio(p)}"></div>`;
  const src=encodeURI(full?p.file:(p.thumb||p.file));
  return full?`<img src="${src}" alt="${esc(p.title)}">`:`<img loading="lazy" decoding="async" src="${src}" alt="${esc(p.title)}" style="${ratio(p)}">`;
}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  view=all.filter(p=>(!decade||Math.floor(p.year/10)*10==decade)&&(!q||[p.title,p.year,p.note].join(" ").toLowerCase().includes(q)));
  $("#count").textContent=view.length+(view.length>1?" peintures":" peinture");
  $("#grid").innerHTML=view.length?view.map((p,i)=>
   `<figure class="card" tabindex="0" role="button" data-i="${i}" aria-label="${esc(p.title)}"><div class="fr">${art(p)}</div><figcaption>${esc(p.title)}${p.year?`<small>${esc(p.year)}</small>`:""}</figcaption></figure>`).join("")
   :`<p class="empty">Aucune peinture ne correspond à cette recherche.</p>`;
}
$("#grid").onclick=e=>{const c=e.target.closest(".card");if(c)show(+c.dataset.i)};
$("#grid").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){const c=e.target.closest(".card");if(c){e.preventDefault();show(+c.dataset.i)}}};

function show(i){
  cur=(i+view.length)%view.length;const p=view[cur];
  $("#lbimg").innerHTML=art(p,true);
  $("#lbcap").innerHTML=`<h2>${esc(p.title)}</h2>`+(p.year?`<p>${esc(p.year)}</p>`:"")+`<p>${esc(p.medium||"Huile, oil")}${p.size?`, ${esc(p.size)}`:""}</p>`+(p.note?`<p>${esc(p.note)}</p>`:"");
  $("#lb").classList.add("open");document.body.style.overflow="hidden";$("#x").focus();
}
function close_(){$("#lb").classList.remove("open");document.body.style.overflow="";
  const c=document.querySelector(`.card[data-i="${cur}"]`);c&&c.focus()}
$("#x").onclick=close_;
$("#prev").onclick=()=>show(cur-1);
$("#next").onclick=()=>show(cur+1);
$("#lb").onclick=e=>{if(e.target.id==="lb")close_()};
addEventListener("keydown",e=>{if(!$("#lb").classList.contains("open"))return;
  if(e.key==="Escape")close_();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
let sx=0;
$("#lb").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("#lb").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});
render();
</script>
</body>
</html>
